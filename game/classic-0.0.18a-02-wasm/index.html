"use strict";
(function(){
	window.eaglercraftXOpts.assetsURI = eaglerEPK("eagler-blob-0",768214);

	if (!window.eaglercraftXOpts.joinServer) {

	var launchCounter = 1;
	var launchCountdownNumberElement = null;

		});
	});
